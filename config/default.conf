# =============================================================================
#  URB-Tools — configuración por defecto
#  No edites este archivo: copia las claves que quieras cambiar a
#    ~/.config/urb-tools/urb.conf   (o ejecuta: urb config init)
#  Formato: CLAVE="valor"   (no se ejecuta código: solo se leen valores)
# =============================================================================

# --- Interfaz -----------------------------------------------------------------
# Animaciones sutiles (arranque, indicador LIVE): 1 = sí, 0 = no
ANIMATIONS="1"
# Segundos entre refrescos de datos del dashboard
REFRESH_INTERVAL="2"
# Estilo del logo: block (incluido) | figlet (requiere figlet)
LOGO_STYLE="block"
LOGO_FONT="slant"
# Motor de menús de los módulos: builtin | fzf
MENU_ENGINE="builtin"
# Qué abre `urb` sin comando: dashboard (menú) | god (como urb god) | red (como urb red)
# `urb dashboard` abre siempre el menú, sea cual sea este valor.
START_MODE="dashboard"

# --- Rutas --------------------------------------------------------------------
# Resultados de escaneos (si estás dentro de un laboratorio CTF, se usa su carpeta scans/)
SCAN_DIR="~/.local/share/urb-tools/scans"
# Carpeta base de los laboratorios CTF
LABS_DIR="~/urb-labs"
BLUE_DIR="~/urb-blue"

# --- RECON (nmap) -------------------------------------------------------------
# Perfiles: SCAN_PROFILE_<nombre>="opciones de nmap"
# No se permiten opciones de entrada/salida de ficheros (-o*, -i*): URB las gestiona.
SCAN_DEFAULT_PROFILE="default"
SCAN_PROFILE_quick="-T4 -F --open"
SCAN_PROFILE_default="-sV -T4 --open"
SCAN_PROFILE_full="-sV -sC -p- -T4 --open"
SCAN_PROFILE_stealth="-sS -T3 --open"
SCAN_PROFILE_udp="-sU --top-ports 50 -T4 --open"
SCAN_PROFILE_os="-O -sV -T4 --open"
# Intervalo con el que nmap informa de su progreso real
SCAN_STATS_EVERY="2s"

# --- NETWORK ------------------------------------------------------------------
# Destinos de la comprobación de conectividad (urb network check)
CHECK_PING_HOST="1.1.1.1"
CHECK_DNS_NAME="kali.org"
CHECK_HTTP_URL="https://www.kali.org"
# Descubrimiento de hosts: solo redes privadas/laboratorio salvo --force
DISCOVER_PRIVATE_ONLY="1"

# --- MONITOR ------------------------------------------------------------------
MONITOR_INTERVAL="2"
MONITOR_PROCS="12"

# --- LOGS ---------------------------------------------------------------------
# Número máximo de líneas a mostrar por defecto
LOGS_LIMIT="200"

# --- GOD MODE (urb god) ---------------------------------------------------------
# Posición del HUD (barra de estado de tmux): top | bottom
GOD_HUD_POSITION="top"
# Ratón en tmux: 1 = la rueda desplaza la salida dentro de GOD/RED (selecciona texto con
# Shift + arrastrar); 0 = sin ratón (la rueda envía ↑/↓ y recorre el historial de Zsh)
GOD_MOUSE="1"

# --- COMMAND ENGINE: urb red recon <modificadores> -------------------------------
# Opciones base de nmap y las que añade cada modificador (solo opciones permitidas
# en perfiles: nada de -o* ni -i*). 'slow' sustituye el -T de la base.
RECON_BASE="-T4 --open"
RECON_MOD_quick="--top-ports 100"
RECON_MOD_full="-p-"
RECON_MOD_udp="-sU --top-ports 50"
RECON_MOD_versions="-sV"
RECON_MOD_scripts="-sC"
RECON_MOD_os="-O"
RECON_MOD_slow="-T2"

# --- COMMAND ENGINE: urb serve -------------------------------------------------------
SERVE_PORT="8000"
SERVE_BIND="127.0.0.1"
