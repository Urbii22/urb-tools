# =============================================================================
#  godmode/tmux.conf — Configuración PROPIA de tmux para URB God Mode
#  Se carga solo en el servidor aislado de God Mode (tmux -L urb-god -f ...).
#  Nunca lee ni modifica tu ~/.tmux.conf ni afecta a tus otras sesiones tmux.
#  Las variables $URB_* las define godmode/god.sh al arrancar el servidor.
# =============================================================================

# --- Terminal -------------------------------------------------------------------
set -g default-terminal "$URB_GOD_TERM"
set -ga terminal-overrides ",xterm-256color:Tc"
set -g escape-time 10
set -g focus-events on
set -g history-limit 50000
set -g set-titles on
set -g set-titles-string "$URB_PROFILE_LABEL · #{pane_current_path}"
# Ratón: god.sh lo ajusta según GOD_MOUSE (1 por defecto) al crear y al reconectar.
# Sin ratón, tmux ocupa la pantalla alternativa y QTerminal convierte la rueda en
# flechas ↑/↓, que Zsh usa para recorrer el historial (comprobado en QTerminal).
# Con ratón, para seleccionar texto con el terminal: Shift + arrastrar.
set -g mouse on

# Copiar: tmux guarda lo seleccionado en su propio búfer y QTerminal no entiende
# OSC 52, así que sin esto no llegaba nada al portapapeles. god.sh detecta
# wl-copy / xclip / xsel y lo deja en URB_GOD_CLIP (también lo reaplica al conectar).
set -s copy-command "$URB_GOD_CLIP"
# Arrastrar con el ratón: al soltar se copia y la selección SIGUE marcada
# (antes desaparecía al instante). Un clic, q o Esc vuelven al prompt.
bind -T copy-mode    MouseDragEnd1Pane send -X copy-pipe-no-clear
bind -T copy-mode-vi MouseDragEnd1Pane send -X copy-pipe-no-clear
bind -T copy-mode    MouseDown1Pane select-pane \; send -X cancel
bind -T copy-mode-vi MouseDown1Pane select-pane \; send -X cancel

# --- Comportamiento de la sesión ---------------------------------------------------
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
setw -g aggressive-resize on
set -g window-size latest
# Cerrar la última shell (exit) termina la sesión; desconectarse (Ctrl+B d) la conserva
set -g exit-empty on
set -g destroy-unattached off
set -g detach-on-destroy on
setw -g remain-on-exit off
set -g display-time 2000

# --- HUD: barra de estado compacta (1 línea) ----------------------------------------
set -g status on
set -g status-position "$URB_GOD_HUD_POSITION"
set -g status-interval 2
set -g status-justify left
set -g status-style "bg=colour${URB_C_BG},fg=colour${URB_C_TEXT}"
set -g status-left-length 24
set -g status-right-length 160
set -g status-left "#[bg=colour${URB_C_PRIMARY},fg=colour${URB_C_INK},bold] ◆ $URB_PROFILE_LABEL #[bg=colour${URB_C_BG},fg=colour${URB_C_PRIMARY},nobold]▌"
set -g status-right "#(\"$URB_GOD_DIR/hud/status.sh\" '#{pane_current_path}' '#{client_width}' '$URB_PROFILE_HUD')"
setw -g window-status-format "#[fg=colour${URB_C_DIM}] #I:#W "
setw -g window-status-current-format "#[bg=colour${URB_C_ELECTRIC},fg=colour${URB_C_INK},bold] #I:#W #[default]"
setw -g window-status-separator ""

# --- Mensajes, copia y bordes ------------------------------------------------------
set -g message-style "bg=colour${URB_C_ELECTRIC},fg=colour${URB_C_INK},bold"
set -g message-command-style "bg=colour${URB_C_BG2},fg=colour${URB_C_PRIMARY}"
setw -g mode-style "bg=colour${URB_C_PRIMARY},fg=colour${URB_C_INK}"
set -g pane-border-style "fg=colour${URB_C_SEP}"
set -g pane-active-border-style "fg=colour${URB_C_PRIMARY}"
set -g display-panes-active-colour "colour${URB_C_GREEN}"
set -g display-panes-colour "colour${URB_C_ELECTRIC}"
setw -g clock-mode-colour "colour${URB_C_PRIMARY}"

# --- Teclas ----------------------------------------------------------------------------
# Se mantienen los atajos estándar de tmux (prefijo Ctrl+B). Nuevas ventanas y
# divisiones abren en el directorio actual del panel.
bind c new-window -c "#{pane_current_path}"
bind '"' split-window -v -c "#{pane_current_path}"
bind % split-window -h -c "#{pane_current_path}"
# Ctrl+B s: menú de sesiones URB (GOD/RED/BLUE) en ventana flotante, en lugar del
# selector de tmux, que solo vería las sesiones de este perfil.
bind s run-shell -b "'$URB_GOD_DIR/../bin/urb' sessions popup '#{client_name}' '#{session_name}' '#{pane_current_path}' '#{socket_path}'"

# --- Rueda del ratón (solo actúa con el ratón activado) ---------------------------------
# - El programa del panel ya usa el ratón, o el panel ya está desplazándose: el evento
#   se le pasa tal cual.
# - Programa a pantalla completa sin ratón (less, man, vim…): se le envían flechas,
#   como haría el terminal sin tmux.
# - Shell normal: se entra en el modo de desplazamiento de tmux (sale solo al llegar
#   abajo, -e), así que la rueda recorre la salida, no el historial de comandos.
bind -n WheelUpPane if -F -t = "#{||:#{pane_in_mode},#{mouse_any_flag}}" \
    "send -M -t =" \
    "if -F -t = '#{alternate_on}' 'send -t = Up ; send -t = Up ; send -t = Up' 'copy-mode -e -t ='"
bind -n WheelDownPane if -F -t = "#{||:#{pane_in_mode},#{mouse_any_flag}}" \
    "send -M -t =" \
    "if -F -t = '#{alternate_on}' 'send -t = Down ; send -t = Down ; send -t = Down'"
