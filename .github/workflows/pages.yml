# Publica la web de site/ en GitHub Pages.
# Requisito único: Settings → Pages → Source = "GitHub Actions".
name: Web (GitHub Pages)

on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Un solo despliegue a la vez; no cancela uno que ya esté en curso.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Configurar Pages
        uses: actions/configure-pages@v5

      - name: Subir site/
        uses: actions/upload-pages-artifact@v5
        with:
          path: site

      - name: Desplegar
        id: deployment
        uses: actions/deploy-pages@v5
